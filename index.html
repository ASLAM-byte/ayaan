<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation</title>
  <meta name="description" content="A digital wedding invitation." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Loader ===== -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-ring"></div>
      <p class="loader-names" id="loaderNames">Loading…</p>
    </div>
  </div>

  <!-- ===== Music toggle ===== -->
  <button id="musicToggle" class="music-toggle" aria-label="Toggle music" hidden>
    <span class="music-icon">♪</span>
  </button>

  <!-- ===== Hero ===== -->
  <header class="hero" id="home">
    <div class="hero-overlay"></div>
    <div class="hero-content reveal">
      <p class="hero-pre">We're getting married</p>
      <h1 class="hero-names">
        <span id="heroBride">Bride</span>
        <span class="amp">&amp;</span>
        <span id="heroGroom">Groom</span>
      </h1>
      <p class="hero-date" id="heroDate">Date</p>
      <p class="hero-tagline" id="heroTagline">Tagline</p>
      <a href="#events" class="scroll-hint" aria-label="Scroll down">
        <span></span>
      </a>
    </div>
  </header>

  <!-- ===== Countdown ===== -->
  <section class="countdown-section" id="countdown">
    <div class="section-inner reveal">
      <p class="script-heading">Counting down to forever</p>
      <div class="countdown" id="countdownWrap">
        <div class="cd-box"><span id="cdDays">0</span><label>Days</label></div>
        <div class="cd-box"><span id="cdHours">0</span><label>Hours</label></div>
        <div class="cd-box"><span id="cdMins">0</span><label>Minutes</label></div>
        <div class="cd-box"><span id="cdSecs">0</span><label>Seconds</label></div>
      </div>
    </div>
  </section>

  <!-- ===== Our Story ===== -->
  <section class="story" id="story">
    <div class="section-inner">
      <p class="script-heading reveal">Our Story</p>
      <span class="divider reveal">❧</span>
      <div class="story-grid">
        <div class="story-card reveal">
          <h3>How We Met</h3>
          <p id="storyMet"></p>
        </div>
        <div class="story-card reveal">
          <h3>The Proposal</h3>
          <p id="storyProposal"></p>
        </div>
      </div>
      <blockquote class="story-quote reveal" id="storyQuote"></blockquote>
    </div>
  </section>

  <!-- ===== Events ===== -->
  <section class="events" id="events">
    <div class="section-inner">
      <p class="script-heading reveal">Wedding Events</p>
      <span class="divider reveal">❧</span>
      <div class="events-grid" id="eventsGrid"></div>
    </div>
  </section>

  <!-- ===== Gallery ===== -->
  <section class="gallery" id="gallery">
    <div class="section-inner">
      <p class="script-heading reveal">Moments</p>
      <span class="divider reveal">❧</span>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </section>

  <!-- ===== RSVP ===== -->
  <section class="rsvp" id="rsvp">
    <div class="section-inner reveal">
      <p class="script-heading">Will you join us?</p>
      <span class="divider">❧</span>
      <p class="rsvp-note" id="rsvpNote"></p>
      <form id="rsvpForm" class="rsvp-form" novalidate>
        <div class="field">
          <input type="text" name="name" id="rsvpName" required placeholder=" " />
          <label for="rsvpName">Your Name</label>
        </div>
        <div class="field">
          <input type="tel" name="phone" id="rsvpPhone" placeholder=" " />
          <label for="rsvpPhone">Phone (optional)</label>
        </div>
        <div class="field">
          <select name="attending" id="rsvpAttending" required>
            <option value="" disabled selected></option>
            <option value="yes">Joyfully accepts</option>
            <option value="no">Regretfully declines</option>
          </select>
          <label for="rsvpAttending">Will you attend?</label>
        </div>
        <div class="field">
          <input type="number" name="guests" id="rsvpGuests" min="1" max="20" placeholder=" " />
          <label for="rsvpGuests">Number of Guests</label>
        </div>
        <div class="field field-full">
          <textarea name="message" id="rsvpMessage" rows="3" placeholder=" "></textarea>
          <label for="rsvpMessage">A note for the couple (optional)</label>
        </div>
        <button type="submit" class="btn" id="rsvpSubmit">Send RSVP</button>
        <p class="rsvp-status" id="rsvpStatus" role="status"></p>
      </form>
      <p class="rsvp-contact" id="rsvpContact"></p>
    </div>
  </section>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <p class="footer-names" id="footerNames"></p>
    <p class="footer-hashtag" id="footerHashtag"></p>
    <a class="btn btn-ghost" id="mapBtn" target="_blank" rel="noopener">Get Directions</a>
    <p class="footer-credit">Made with ♥ for our special day</p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
