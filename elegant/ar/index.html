<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نور ويوسف — ٢٢ مايو ٢٠٢٧</title>
  <meta name="description" content="تتشرف عائلتا نور ويوسف بدعوتكم لحضور حفل زفافهما في ٢٢ مايو ٢٠٢٧ في قصر الزيتون، إكس أون بروفانس." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1200&auto=format&fit=crop" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600&family=Reem+Kufi:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/site.css" />
</head>
<body data-lang="ar" dir="rtl">
  <div class="loader" aria-hidden="true"><div class="loader__mono"><span>نور ويوسف</span></div></div>

  <main>
    <header class="hero">
      <div class="hero__col">
        <p class="hero__invite meta fade" data-i18n="home.heroInvite">بمشاركة عائلتيهما</p>
        <h1 class="hero__names" aria-label="نور ويوسف">
          <span class="row"><i data-name="one">نور</i></span>
          <span class="amp"><i>&amp;</i></span>
          <span class="row"><i data-name="two">يوسف</i></span>
        </h1>
        <div class="hero__meta">
          <p class="hero__date fade" data-date></p>
          <p class="hero__loc meta fade" data-venue-city></p>
        </div>
        <div class="hero__cta fade"><a href="rsvp.html" class="btn btn--olive" data-magnetic="0.3" data-cursor="افتح" data-i18n="home.rsvpCta">تأكيد الحضور <span class="arw">↗</span></a></div>
      </div>
      <div class="hero__figure">
        <div class="deco deco--spin" style="top:-4%;left:-4%;width:90px;height:90px;z-index:4" aria-hidden="true">
          <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="0.7"><circle cx="50" cy="50" r="5"/><g><path d="M50 45c5-13 5-28 0-38M50 55c-5 13-5 28 0 38M45 50c-13 5-28 5-38 0M55 50c13-5 28-5 38 0M46 46C37 37 28 31 19 29M54 54c9 9 18 15 27 17"/></g></svg>
        </div>
        <div class="img-mask"><img src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1100&auto=format&fit=crop" alt="نور ويوسف" loading="eager" /></div>
        <div class="accent img-mask" data-parallax="0.05"><img src="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?q=80&w=500&auto=format&fit=crop" alt="لحظة هادئة" loading="eager" /></div>
      </div>
      <a href="#countdown" class="hero__scroll" aria-label="اسحب للأسفل"><span data-i18n="home.scrollHint">اسحب للأسفل</span><span class="ln"></span></a>
    </header>

    <section class="section countdown" id="countdown">
      <div class="wrap">
        <p class="meta fade" data-i18n="home.countdownLabel">حتى نقول نعم</p>
        <div class="countdown__grid" data-countdown>
          <div class="cd-unit"><div class="cd-unit__num" data-cd="days"><span class="tick">٠</span></div><div class="cd-unit__label" data-i18n="home.cd.days">يوم</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-unit__num" data-cd="hours"><span class="tick">٠٠</span></div><div class="cd-unit__label" data-i18n="home.cd.hours">ساعة</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-unit__num" data-cd="minutes"><span class="tick">٠٠</span></div><div class="cd-unit__label" data-i18n="home.cd.minutes">دقيقة</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-unit__num" data-cd="seconds"><span class="tick">٠٠</span></div><div class="cd-unit__label" data-i18n="home.cd.seconds">ثانية</div></div>
        </div>
        <p class="countdown__past" data-countdown-past hidden data-i18n="home.past"></p>
      </div>
    </section>

    <section class="section invite">
      <div class="wrap">
        <p class="meta fade" data-i18n="home.inviteKicker">الدعوة</p>
        <p data-invite></p>
      </div>
    </section>

    <section class="section story-prev">
      <div class="wrap story-prev__grid">
        <div class="story-prev__media">
          <div class="story-prev__big img-mask" data-parallax="0.03"><img src="https://images.unsplash.com/photo-1521511897085-c4e5f8f43cf6?q=80&w=800&auto=format&fit=crop" alt="نور ويوسف" loading="lazy" /></div>
          <div class="story-prev__small img-mask" data-parallax="0.07"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=500&auto=format&fit=crop" alt="مغامرة جمعتهما" loading="lazy" /></div>
        </div>
        <div class="story-prev__body">
          <p class="meta fade" data-i18n="home.storyKicker">كيف التقينا</p>
          <h2 data-i18n="home.storyTitle">قصتنا</h2>
          <p class="fade" data-story-intro></p>
          <a href="our-story.html" class="btn" data-magnetic="0.3" data-cursor="افتح" data-i18n="home.storyCta">اقرأ قصتنا <span class="arw">↗</span></a>
        </div>
      </div>
    </section>

    <section class="section dress">
      <div class="wrap">
        <span class="meta fade" data-i18n="home.dressKicker">قواعد اللباس</span>
        <h2 data-dress-title></h2>
        <p class="fade" data-dress-desc></p>
        <div class="palette" data-render="palette" data-stagger="0.08"></div>
      </div>
    </section>

    <section class="section venue">
      <div class="wrap">
        <div class="sec-head">
          <span class="meta" data-i18n="home.venueKicker">المكان</span>
          <h2 data-i18n="home.venueTitle">القاعة</h2>
        </div>
      </div>
      <div class="venue__media img-mask" data-parallax="0.04"><img data-venue-img src="" alt="القاعة" loading="lazy" /></div>
      <div class="wrap">
        <div class="venue__card fade">
          <h3 data-venue-name></h3>
          <p data-venue-address></p>
          <p class="meta" data-venue-city2></p>
          <a data-venue-map href="#" target="_blank" rel="noopener" class="btn btn--olive" data-magnetic="0.25" data-cursor="افتح" data-i18n="home.directions">الاتجاهات <span class="arw">↗</span></a>
        </div>
      </div>
    </section>
  </main>

  <div class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="عارض الصور">
    <button class="lightbox__close" aria-label="إغلاق">✕</button>
    <button class="lightbox__btn lightbox__prev" aria-label="السابق">‹</button>
    <img class="lightbox__img" src="" alt="" />
    <button class="lightbox__btn lightbox__next" aria-label="التالي">›</button>
    <span class="lightbox__count"></span>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/partials.js"></script>
  <script src="../js/render.js"></script>
  <script src="../js/page.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/engine.js"></script>
  <script src="../js/ui.js"></script>
</body>
</html>
