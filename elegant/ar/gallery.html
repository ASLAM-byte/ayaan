<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المعرض — نور ويوسف</title>
  <meta name="description" content="بعضٌ من الصور التي جمعها نور ويوسف في طريقهما إلى هنا." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600&family=Reem+Kufi:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/site.css" />
</head>
<body data-lang="ar" dir="rtl">
  <main>
    <header class="page-hero">
      <div class="wrap">
        <p class="meta fade" data-i18n="gallery.kicker">لحظات</p>
        <h1 aria-label="المعرض"><span class="row"><span class="line-in" data-i18n="gallery.title">المعرض</span></span></h1>
        <p class="page-hero__lede fade" data-i18n="gallery.lede">بعضٌ من الصور التي جمعناها في طريقنا إلى هنا.</p>
      </div>
    </header>
    <section class="section" style="padding-top:clamp(1rem,3vw,2rem)">
      <div class="wrap"><div class="gallery__grid" data-gallery></div></div>
    </section>
  </main>

  <div class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="عارض الصور">
    <button class="lightbox__close" aria-label="إغلاق">✕</button>
    <button class="lightbox__btn lightbox__prev" aria-label="السابق">‹</button>
    <img class="lightbox__img" src="" alt="" />
    <button class="lightbox__btn lightbox__next" aria-label="التالي">›</button>
    <span class="lightbox__count"></span>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/partials.js"></script>
  <script src="../js/render.js"></script>
  <script src="../js/page.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/engine.js"></script>
  <script src="../js/ui.js"></script>
</body>
</html>
