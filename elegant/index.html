<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noor &amp; Yusuf — 22 May 2027</title>
  <meta name="description" content="Noor & Yusuf are getting married on 22 May 2027 at Château des Oliviers, Aix-en-Provence. Together with their families, they'd love for you to celebrate with them." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="image" href="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1200&auto=format&fit=crop" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600&family=Reem+Kufi:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body data-lang="en">
  <div class="loader" aria-hidden="true"><div class="loader__mono"><span>N &amp; Y</span></div></div>

  <main>
    <!-- HERO (asymmetric) -->
    <header class="hero">
      <div class="hero__col">
        <p class="hero__invite meta fade" data-i18n="home.heroInvite">Together with their families</p>
        <h1 class="hero__names" aria-label="Noor and Yusuf">
          <span class="row"><i data-name="one">Noor</i></span>
          <span class="amp"><i>&amp;</i></span>
          <span class="row"><i data-name="two">Yusuf</i></span>
        </h1>
        <div class="hero__meta">
          <p class="hero__date fade" data-date></p>
          <p class="hero__loc meta fade" data-venue-city></p>
        </div>
        <div class="hero__cta fade"><a href="rsvp.html" class="btn btn--olive" data-magnetic="0.3" data-cursor="OPEN" data-i18n="home.rsvpCta">RSVP <span class="arw">↗</span></a></div>
      </div>
      <div class="hero__figure">
        <div class="deco deco--spin" style="top:-4%;right:-4%;width:90px;height:90px;z-index:4" aria-hidden="true">
          <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="0.7"><circle cx="50" cy="50" r="5"/><g><path d="M50 45c5-13 5-28 0-38M50 55c-5 13-5 28 0 38M45 50c-13 5-28 5-38 0M55 50c13-5 28-5 38 0M46 46C37 37 28 31 19 29M54 54c9 9 18 15 27 17"/></g></svg>
        </div>
        <div class="img-mask"><img src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1100&auto=format&fit=crop" alt="Noor and Yusuf" loading="eager" /></div>
        <div class="accent img-mask" data-parallax="0.05"><img src="https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?q=80&w=500&auto=format&fit=crop" alt="A quiet moment" loading="eager" /></div>
      </div>
      <a href="#countdown" class="hero__scroll" aria-label="Scroll down"><span data-i18n="home.scrollHint">Scroll</span><span class="ln"></span></a>
    </header>

    <!-- COUNTDOWN -->
    <section class="section countdown" id="countdown">
      <div class="wrap">
        <p class="meta fade" data-i18n="home.countdownLabel">Until we say I do</p>
        <div class="countdown__grid" data-countdown>
          <div class="cd-unit"><div class="cd-unit__num" data-cd="days"><span class="tick">0</span></div><div class="cd-unit__label" data-i18n="home.cd.days">Days</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-unit__num" data-cd="hours"><span class="tick">00</span></div><div class="cd-unit__label" data-i18n="home.cd.hours">Hours</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-unit__num" data-cd="minutes"><span class="tick">00</span></div><div class="cd-unit__label" data-i18n="home.cd.minutes">Minutes</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-unit__num" data-cd="seconds"><span class="tick">00</span></div><div class="cd-unit__label" data-i18n="home.cd.seconds">Seconds</div></div>
        </div>
        <p class="countdown__past" data-countdown-past hidden data-i18n="home.past"></p>
      </div>
    </section>

    <!-- INVITATION -->
    <section class="section invite">
      <div class="wrap">
        <p class="meta fade" data-i18n="home.inviteKicker">The Invitation</p>
        <p data-invite></p>
      </div>
    </section>

    <!-- STORY PREVIEW -->
    <section class="section story-prev">
      <div class="wrap story-prev__grid">
        <div class="story-prev__media">
          <div class="story-prev__big img-mask" data-parallax="0.03"><img src="https://images.unsplash.com/photo-1521511897085-c4e5f8f43cf6?q=80&w=800&auto=format&fit=crop" alt="Noor and Yusuf" loading="lazy" /></div>
          <div class="story-prev__small img-mask" data-parallax="0.07"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=500&auto=format&fit=crop" alt="A shared adventure" loading="lazy" /></div>
        </div>
        <div class="story-prev__body">
          <p class="meta fade" data-i18n="home.storyKicker">How we met</p>
          <h2 data-split="word" data-i18n="home.storyTitle">Our Story</h2>
          <p class="fade" data-story-intro></p>
          <a href="our-story.html" class="btn" data-magnetic="0.3" data-cursor="OPEN" data-i18n="home.storyCta">Read our story <span class="arw">↗</span></a>
        </div>
      </div>
    </section>

    <!-- DRESS CODE -->
    <section class="section dress">
      <div class="wrap">
        <span class="meta fade" data-i18n="home.dressKicker">What to wear</span>
        <h2 data-split="word" data-dress-title></h2>
        <p class="fade" data-dress-desc></p>
        <div class="palette" data-render="palette" data-stagger="0.08"></div>
      </div>
    </section>

    <!-- VENUE -->
    <section class="section venue">
      <div class="wrap">
        <div class="sec-head">
          <span class="meta" data-i18n="home.venueKicker">The Setting</span>
          <h2 data-split="word" data-i18n="home.venueTitle">The Venue</h2>
        </div>
      </div>
      <div class="venue__media img-mask" data-parallax="0.04"><img data-venue-img src="" alt="The venue" loading="lazy" /></div>
      <div class="wrap">
        <div class="venue__card fade">
          <h3 data-venue-name></h3>
          <p data-venue-address></p>
          <p class="meta" data-venue-city2></p>
          <a data-venue-map href="#" target="_blank" rel="noopener" class="btn btn--olive" data-magnetic="0.25" data-cursor="OPEN" data-i18n="home.directions">Get Directions <span class="arw">↗</span></a>
        </div>
      </div>
    </section>
  </main>

  <div class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox__close" aria-label="Close">✕</button>
    <button class="lightbox__btn lightbox__prev" aria-label="Previous">‹</button>
    <img class="lightbox__img" src="" alt="" />
    <button class="lightbox__btn lightbox__next" aria-label="Next">›</button>
    <span class="lightbox__count"></span>
  </div>

  <script src="js/config.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/render.js"></script>
  <script src="js/page.js"></script>
  <script src="js/components.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
