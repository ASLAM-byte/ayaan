<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Wedding — Noor &amp; Yusuf</title>
  <meta name="description" content="The order of the evening — ceremony, cocktails, dinner, and dancing at Château des Oliviers." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600&family=Reem+Kufi:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body data-lang="en">
  <main>
    <header class="page-hero">
      <div class="wrap">
        <p class="meta fade" data-i18n="wedding.kicker">The Day</p>
        <h1 aria-label="The Wedding"><span class="row"><span class="line-in" data-i18n="wedding.title">The Wedding</span></span></h1>
        <p class="page-hero__lede fade" data-date></p>
      </div>
    </header>

    <section class="section" style="padding-top:clamp(1rem,3vw,2rem)">
      <div class="wrap">
        <div class="sec-head"><span class="meta" data-i18n="wedding.scheduleKicker">The Order of the Evening</span></div>
        <div class="sched-list" data-render="schedule"></div>
      </div>
    </section>

    <section class="section venue">
      <div class="wrap">
        <div class="sec-head">
          <span class="meta" data-i18n="home.venueKicker">The Setting</span>
          <h2 data-split="word" data-i18n="home.venueTitle">The Venue</h2>
        </div>
      </div>
      <div class="venue__media img-mask" data-parallax="0.04"><img data-venue-img src="" alt="The venue" loading="lazy" /></div>
      <div class="wrap">
        <div class="venue__card fade">
          <h3 data-venue-name></h3>
          <p data-venue-address></p>
          <p class="meta" data-venue-city2></p>
          <a data-venue-map href="#" target="_blank" rel="noopener" class="btn btn--olive" data-magnetic="0.25" data-cursor="OPEN" data-i18n="home.directions">Get Directions <span class="arw">↗</span></a>
        </div>
      </div>
    </section>

    <section class="section" style="text-align:center">
      <div class="wrap"><a href="rsvp.html" class="btn btn--olive btn--lg" data-magnetic="0.3" data-cursor="OPEN" data-i18n="home.rsvpCta">RSVP <span class="arw">↗</span></a></div>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/render.js"></script>
  <script src="js/page.js"></script>
  <script src="js/components.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
