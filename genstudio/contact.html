<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — GEN STUDIO</title>
  <meta name="description" content="Let's make something visual. Start a project with Gen Studio." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <main>
    <header class="page-hero wrap">
      <div class="page-hero__label meta spaced fade">Get in touch</div>
      <h1 aria-label="Let's make something visual">
        <span class="row"><span class="line-in">Let's Make</span></span>
        <span class="row"><span class="line-in">Something</span></span>
        <span class="row"><span class="line-in" style="color:var(--gray)">Visual.</span></span>
      </h1>
    </header>

    <section class="section" style="padding-top:clamp(2rem,5vw,4rem)">
      <div class="wrap contact-grid">
        <form class="contact-form" id="contactForm" novalidate>
          <div class="row">
            <div class="field"><label for="cName">Name</label><input type="text" id="cName" name="name" required /></div>
            <div class="field"><label for="cEmail">Email</label><input type="email" id="cEmail" name="email" required /></div>
          </div>
          <div class="row">
            <div class="field"><label for="cCompany">Company</label><input type="text" id="cCompany" name="company" /></div>
            <div class="field">
              <label for="cType">Project Type</label>
              <select id="cType" name="type">
                <option value="">Select…</option>
                <option>Campaign Imagery</option>
                <option>Product Visuals</option>
                <option>Social Content</option>
                <option>AI Video</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="cBudget">Budget</label>
            <select id="cBudget" name="budget">
              <option value="">Select…</option>
              <option>&lt; €5k</option>
              <option>€5k – €15k</option>
              <option>€15k – €50k</option>
              <option>€50k +</option>
            </select>
          </div>
          <div class="field"><label for="cMsg">Message</label><textarea id="cMsg" name="message" rows="4" required></textarea></div>
          <button type="submit" class="btn btn--lg" data-magnetic="0.3" data-cursor="SEND">Send message <span class="arw">↗</span></button>
          <p class="form-status" id="formStatus" role="status"></p>
        </form>

        <aside class="contact-side">
          <div>
            <h3>Available</h3>
            <p>Mon – Fri, 9–18 CET</p>
          </div>
          <div>
            <h3>Email</h3>
            <a href="mailto:hello@genstudio.co" class="ul">hello@genstudio.co</a>
          </div>
          <div>
            <h3>Phone</h3>
            <p>+31 20 000 0000</p>
          </div>
          <div>
            <h3>Studio</h3>
            <p>Keizersgracht 241<br />1016 EA Amsterdam<br />Netherlands</p>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="js/partials.js"></script>
  <script>
    (function () {
      var form = document.getElementById("contactForm");
      if (!form) return;
      var status = document.getElementById("formStatus");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("cName").value.trim();
        var email = document.getElementById("cEmail").value.trim();
        var msg = document.getElementById("cMsg").value.trim();
        if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !msg) {
          status.textContent = "Please add your name, a valid email, and a message.";
          status.style.color = "#c0392b";
          return;
        }
        status.style.color = "var(--gray)";
        status.textContent = "Thanks, " + name + ". We'll be in touch within one working day.";
        form.reset();
      });
    })();
  </script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
