<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal — GEN STUDIO</title>
  <meta name="description" content="Perspectives on art direction, generative AI, process, and motion from the Gen Studio journal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <main>
    <header class="page-hero wrap">
      <div class="page-hero__label meta spaced fade">The Journal</div>
      <h1 aria-label="Journal">
        <span class="row"><span class="line-in">Journal</span></span>
      </h1>
      <p class="page-hero__lede fade">Notes on art direction, generative AI, process, and the craft of making visuals that mean something.</p>
    </header>

    <section class="section" style="padding-top:clamp(2rem,5vw,4rem)">
      <div class="wrap">
        <div class="blog-grid" id="blogGrid"><!-- injected --></div>
      </div>
    </section>
  </main>

  <script src="js/partials.js"></script>
  <script src="js/data.js"></script>
  <script>
    (function () {
      var D = window.GEN_DATA; if (!D) return;
      var host = document.getElementById("blogGrid");
      D.articles.forEach(function (a) {
        var t = document.createElement("template");
        t.innerHTML = (
          '<a class="blog-card" href="article.html?a=' + a.slug + '" data-cursor="READ" data-reveal>' +
            '<div class="blog-card__media img-mask"><img src="' + D.IMG(a.img, 1000) + '" alt="' + a.title + '" loading="lazy" /></div>' +
            '<div class="blog-card__tags meta"><span>' + a.cat + '</span><span>' + a.date + '</span></div>' +
            '<h2 class="blog-card__title">' + a.title + '</h2>' +
            '<p class="blog-card__excerpt">' + a.excerpt + '</p>' +
          '</a>'
        ).trim();
        host.appendChild(t.content.firstChild);
      });
      if (window.GEN_bindCursor) window.GEN_bindCursor();
    })();
  </script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
